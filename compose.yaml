services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: siteflow
      POSTGRES_USER: siteflow
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Defina POSTGRES_PASSWORD no ambiente}
    ports:
      - '127.0.0.1:5432:5432'
    volumes:
      - siteflow_db:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U siteflow -d siteflow']
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  siteflow_db:
